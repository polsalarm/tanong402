<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tanong402 · splash C (Ask bubble)</title>
<style>
  :root { --ease: cubic-bezier(.22,1,.36,1); --pop: cubic-bezier(.34,1.56,.64,1); --move: cubic-bezier(.72,0,.24,1); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans, Inter, system-ui, sans-serif); color: var(--foreground, #e9ecf1); }
  .player { position: relative; height: 460px; border-radius: 18px; overflow: hidden; background: radial-gradient(ellipse at 50% 46%, #172036 0%, #0b0f1a 46%, #05070d 100%); }
  .player button { position: absolute; right: 16px; bottom: 16px; z-index: 30; border: 1px solid #c9cfd833; background: #111726; color: #c9cfd8; border-radius: 999px; padding: 7px 13px; font: 600 11px var(--font-sans, Inter, sans-serif); cursor: pointer; }
  .label { position: absolute; right: 16px; top: 16px; z-index: 30; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #9aa3b2; }
  .label b { color: #e9ecf1; letter-spacing: 0; text-transform: none; font-size: 13px; margin-left: 6px; }

  /* The page that the splash reveals. */
  .page { position: absolute; inset: 0; padding: 22px; opacity: 0; background: radial-gradient(ellipse at 60% -10%, #252e43 0, transparent 50%), linear-gradient(180deg, #0b0f1a, #07090f); }
  .nav { display: flex; align-items: center; gap: 8px; }
  .nav .slot { width: 26px; height: 26px; }
  .nav span { font-weight: 650; font-size: 17px; letter-spacing: -.04em; background: linear-gradient(100deg,#f5f7fa,#c9cfd8 40%,#8e97a6 70%,#e6e9ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .page h3 { margin: 80px 0 0; font-size: 44px; line-height: .95; letter-spacing: -.05em; font-weight: 600; color: #e9ecf1; }
  .page h3 em { font-style: normal; background: linear-gradient(110deg,#f5f7fa,#c9cfd8 39%,#8e97a6 67%,#e6e9ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .page p { color: #9aa3b2; font-size: 14px; margin: 14px 0 0; }

  /* Splash layers. */
  .halo { position: absolute; left: 50%; top: 44%; width: 340px; height: 340px; translate: -50% -50%; border-radius: 50%; background: radial-gradient(circle, #8fb3ff2e 0%, #8fb3ff0d 40%, transparent 70%); opacity: 0; }
  .sky { position: absolute; left: 50%; top: 44%; width: 320px; height: 320px; translate: -50% -50%; overflow: visible; }
  .sky .ln { fill: none; stroke: #d6e0f566; stroke-width: .6; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .sky .st { fill: #f5f7fa; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .mark { position: absolute; left: 50%; top: 44%; width: 132px; height: 132px; translate: -50% -50%; overflow: visible; filter: drop-shadow(0 18px 40px #00000080) drop-shadow(0 0 30px #8fb3ff26); }
  .mark .bubble { transform-box: fill-box; transform-origin: 30% 85%; transform: scale(0); }
  .mark .gloss { opacity: 0; }
  .mark .dot { fill: #0b0f1a; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .mark .q { fill: none; stroke: #0b0f1a; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .mark .shine { opacity: 0; }
  .seed { position: absolute; left: 50%; top: 44%; width: 10px; height: 10px; translate: -50% -50%; border-radius: 50%; background: radial-gradient(circle, #fff, #c9cfd8 60%, #8e97a6); box-shadow: 0 0 18px #c9d6ff, 0 0 40px #8fb3ff88; opacity: 0; }
  .word { position: absolute; left: 0; right: 0; top: calc(44% + 84px); text-align: center; opacity: 0; }
  .word strong { font-size: 22px; letter-spacing: -.05em; font-weight: 620; background: linear-gradient(100deg,#f5f7fa,#c9cfd8 42%,#8e97a6 70%,#e6e9ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .word small { font-size: 10px; letter-spacing: .14em; color: #9aa3b2; margin-left: 3px; }
  .word i { display: block; margin-top: 8px; font-style: normal; font-size: 9px; letter-spacing: .26em; text-transform: uppercase; color: #8fb3ff; }

  /* Timeline (≈3.6 s). */
  .play .seed { animation: seed-in .35s var(--ease) .05s forwards, seed-out .2s ease .52s forwards; }
  .play .halo { animation: fade-in .9s ease .4s forwards, fade-out .5s ease 3s forwards; }
  .play .mark .bubble { animation: inflate .62s var(--pop) .45s forwards; }
  .play .mark .gloss { animation: fade-in .4s ease .8s forwards; }
  .play .mark .d1 { animation: dot-in .2s ease 1.05s forwards, type 0.5s ease-in-out 1.15s 2, fade-out .2s ease 2.1s forwards; }
  .play .mark .d2 { animation: dot-in .2s ease 1.12s forwards, type 0.5s ease-in-out 1.27s 2, fade-out .2s ease 2.1s forwards; }
  .play .mark .d3 { animation: dot-in .2s ease 1.19s forwards, type 0.5s ease-in-out 1.39s 2, drop .45s var(--move) 2.15s forwards; }
  .play .mark .q { animation: draw .55s var(--ease) 2.15s forwards; }
  .play .mark .shine { animation: fade-in .01s linear 2.5s forwards; }
  .play .mark .shine rect { animation: sweep .7s ease-in-out 2.5s forwards; }
  .play .sky .ln { animation: draw 1.2s var(--ease) 1.4s forwards, fade-out .5s ease 2.9s forwards; }
  .play .sky .st { animation: star .4s var(--pop) forwards, fade-out .5s ease 2.9s forwards; }
  .play .word { animation: rise .5s var(--ease) 2.55s forwards, fade-out .25s ease 3.15s forwards; }
  .play .mark { animation: fly .7s var(--move) 3.15s forwards; }
  .play .page { animation: fade-in .5s ease 3.45s forwards; }

  @keyframes seed-in { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
  @keyframes seed-out { to { opacity: 0; transform: scale(2.4); } }
  @keyframes inflate { 0% { transform: scale(0) rotate(-8deg); } 70% { transform: scale(1.06) rotate(1deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes dot-in { to { opacity: 1; } }
  @keyframes type { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
  @keyframes drop { to { transform: translate(-11px, 13px) scale(1.18); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes sweep { from { transform: translateX(-140px) skewX(-18deg); } to { transform: translateX(160px) skewX(-18deg); } }
  @keyframes star { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fly { to { left: 35px; top: 35px; width: 26px; height: 26px; filter: none; } }
  @keyframes fade-in { to { opacity: 1; } }
  @keyframes fade-out { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .play * { animation-duration: .01s !important; animation-delay: 0s !important; } }
</style>
</head>
<body>
<div class="player" id="C">
  <span class="label">C<b>Ask bubble</b></span>
  <div class="page">
    <div class="nav"><span class="slot"></span><span>Tanong</span></div>
    <h3>Bayad per<br /><em>tanong.</em></h3>
    <p>₱0.30 a question. Not ₱1,100 a month.</p>
  </div>
  <div class="halo"></div>
  <svg class="sky" viewBox="0 0 320 320">
    <path class="ln" pathLength="1" d="M70 96 L118 52 L196 46 L256 92 L268 170 M70 96 L54 172 L92 244 M268 170 L232 246 L160 276" />
    <g>
      <circle class="st" cx="70" cy="96" r="2.2" style="animation-delay:1.3s, 2.9s" />
      <circle class="st" cx="118" cy="52" r="1.6" style="animation-delay:1.42s, 2.9s" />
      <circle class="st" cx="196" cy="46" r="2" style="animation-delay:1.54s, 2.9s" />
      <circle class="st" cx="256" cy="92" r="1.5" style="animation-delay:1.66s, 2.9s" />
      <circle class="st" cx="268" cy="170" r="2.3" style="animation-delay:1.78s, 2.9s" />
      <circle class="st" cx="54" cy="172" r="1.5" style="animation-delay:1.5s, 2.9s" />
      <circle class="st" cx="92" cy="244" r="1.9" style="animation-delay:1.7s, 2.9s" />
      <circle class="st" cx="232" cy="246" r="1.6" style="animation-delay:1.9s, 2.9s" />
      <circle class="st" cx="160" cy="276" r="2.1" style="animation-delay:2.02s, 2.9s" />
    </g>
  </svg>
  <div class="seed"></div>
  <svg class="mark" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="silver" x1="10" y1="12" x2="90" y2="92" gradientUnits="userSpaceOnUse">
        <stop stop-color="#F5F7FA" /><stop offset=".3" stop-color="#C9CFD8" /><stop offset=".55" stop-color="#8E97A6" /><stop offset=".8" stop-color="#E6E9EE" /><stop offset="1" stop-color="#AEB6C2" />
      </linearGradient>
      <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".55" /><stop offset=".5" stop-color="#fff" stop-opacity="0" /></linearGradient>
      <linearGradient id="shine" x1="0" x2="1"><stop stop-color="#fff" stop-opacity="0" /><stop offset=".5" stop-color="#fff" stop-opacity=".85" /><stop offset="1" stop-color="#c9d6ff" stop-opacity="0" /></linearGradient>
      <clipPath id="bubble-clip"><path d="M18 13h64a10 10 0 0 1 10 10v40a10 10 0 0 1-10 10H46L28 87V73H18A10 10 0 0 1 8 63V23a10 10 0 0 1 10-10Z" /></clipPath>
    </defs>
    <g class="bubble">
      <path d="M18 13h64a10 10 0 0 1 10 10v40a10 10 0 0 1-10 10H46L28 87V73H18A10 10 0 0 1 8 63V23a10 10 0 0 1 10-10Z" fill="url(#silver)" />
      <path class="gloss" d="M18 14h64a9 9 0 0 1 9 9v12H9V23a9 9 0 0 1 9-9Z" fill="url(#gloss)" />
      <path class="q" pathLength="1" d="M40 35c0-7 5-11 11-11s10 4 10 9c0 5-3 7-7 10-2 1.5-3 3.5-3 6" />
      <circle class="dot d1" cx="38" cy="47" r="3.8" />
      <circle class="dot d2" cx="50" cy="47" r="3.8" />
      <circle class="dot d3" cx="62" cy="47" r="3.8" />
      <g class="shine" clip-path="url(#bubble-clip)"><rect x="0" y="0" width="28" height="100" fill="url(#shine)" /></g>
    </g>
  </svg>
  <div class="word"><strong>Tanong</strong><small>402</small><i>Ask anything</i></div>
  <button onclick="replay()">↻ Replay</button>
</div>
<script>
  function replay() {
    const el = document.getElementById("C");
    el.classList.remove("play"); void el.offsetWidth; el.classList.add("play");
  }
  replay();
</script>
</body>
</html>
