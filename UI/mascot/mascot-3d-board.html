<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuwago — 3D pose board</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#07090f;color:#e8ebf1;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:2840px;padding:34px 42px 42px;margin:auto}.eyebrow{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:#8fb3ff;font-weight:700}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}h1{font-size:36px;letter-spacing:-.04em;margin:8px 0 0}.meta{font-size:14px;color:#8d96a8}.board{padding:20px 22px 24px;border-radius:22px;margin:0 0 22px;background:#111621;border:1px solid #252c3b}.board.light{background:#e9ecf1;color:#252a34;border-color:#d7dce4}.label{font-weight:700;font-size:17px;margin:0 0 13px}.label span{font-weight:400;opacity:.62}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}.tile{border-radius:15px;padding:10px 10px 12px;background:#0b0f18;border:1px solid #252b38;text-align:center;min-width:0}.light .tile{background:#f7f8fa;border-color:#e0e4eb}.pose{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:800;color:#aeb9cd;margin:0 0 4px}.light .pose{color:#647086}.hero{width:320px;height:320px;object-fit:contain;display:block;margin:0 auto}.mini{width:96px;height:96px;object-fit:contain;display:block;margin:1px auto 0}.sizes{font-size:10px;letter-spacing:.08em;color:#7d8799}.light .sizes{color:#7a8493}.proof{font-size:11px;color:#8791a2;text-align:center;margin-top:18px}
</style></head><body><main>
<header class="head"><div><div class="eyebrow">Tanong402 · Midnight Silver</div><h1>Kuwago, sculpted in 3D</h1></div><div class="meta">8 poses · transparent WebP · 1024 px and 512 px exports</div></header>
<section class="board"><h2 class="label">Midnight <span>#07090F</span></h2><div class="grid" id="dark"></div></section>
<section class="board light"><h2 class="label">Moonlight <span>#F4F5F7</span></h2><div class="grid" id="light"></div></section>
<div class="proof">Every pose checked at 320 px and 96 px · pearl satin body · moonlight rim · transparent edges</div>
</main><script>
const poses=['wave','invite','thinking','reading','celebrate','sleepy','peek','point'];for(const id of ['dark','light']){const root=document.getElementById(id);for(const pose of poses){const card=document.createElement('article');card.className='tile';card.innerHTML=`<h3 class="pose">${pose}</h3><img class="hero" src="../../apps/web/public/mascot/${pose}.webp" alt="Kuwago ${pose} pose at 320 pixels"><div class="sizes">320 PX</div><img class="mini" src="../../apps/web/public/mascot/${pose}@512.webp" alt="Kuwago ${pose} pose preview"><div class="sizes">96 PX PREVIEW</div>`;root.append(card)}}
</script></body></html>
