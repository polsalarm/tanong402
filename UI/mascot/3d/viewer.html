<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuwago 3D viewer</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#07090f;color:#e9edf4;font:14px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{display:block}#label{position:fixed;left:22px;top:18px;z-index:2;color:#c9cfd8}#label b{font-size:16px;letter-spacing:.02em}#label span{display:block;color:#8b97ad;margin-top:3px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><div id="label"><b>Kuwago · 3D inspection</b><span>Drag to orbit · scroll to zoom</span></div><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#07090f');const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,100);camera.position.set(3.1,2.1,6.5);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;scene.environmentIntensity=.75;scene.add(new THREE.HemisphereLight(0xeaf0ff,0x4b5260,1));const key=new THREE.DirectionalLight(0xfff7ed,2.2);key.position.set(-3,5,5);scene.add(key);const rim=new THREE.DirectionalLight(0x8fb3ff,2.4);rim.position.set(3,4,-3);scene.add(rim);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;new GLTFLoader().load('../../../apps/web/public/mascot/kuwago.glb',g=>{scene.add(g.scene);g.scene.position.y=.1},undefined,e=>{document.getElementById('label').innerHTML+='<span>Could not load GLB. Serve this folder over HTTP.</span>';console.error(e)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}frame();
</script></body></html>
