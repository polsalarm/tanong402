<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuwago · eight expressive poses</title>
<style>
*{box-sizing:border-box}html,body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9ecf1;background:#07090f}body{padding:34px 40px 42px}.intro{display:flex;align-items:end;justify-content:space-between;margin:0 0 22px}.eyebrow{color:#8fb3ff;letter-spacing:.16em;text-transform:uppercase;font-size:12px;font-weight:650}.intro h1{font-size:32px;letter-spacing:-.04em;margin:7px 0 0}.intro p{margin:0;color:#9aa3b2;font-size:14px}.theme{padding:18px;border:1px solid #ffffff18;border-radius:20px;margin:0 0 20px;background:linear-gradient(145deg,#111726,#0b0f1a)}.theme.light{background:#f4f5f7;color:#151922;border-color:#15192218}.theme h2{font-size:16px;margin:0 0 12px;font-weight:650}.theme h2 span{font-weight:450;opacity:.58;margin-left:8px}.columns{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}.pose{border-radius:12px;background:#07090f66;padding:10px 7px 10px;text-align:center;overflow:hidden}.light .pose{background:#fff}.name{font-size:11px;font-weight:650;letter-spacing:.03em;margin:0 0 6px;text-transform:uppercase;color:#aab5c8}.light .name{color:#536075}.sizes{display:grid;gap:6px}.size-card{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;background:#0b0f1a;padding:5px 3px;min-height:77px;overflow:hidden}.light .size-card{background:#f4f5f7}.size-card.large{min-height:245px}.size-card.medium{min-height:110px}.size-card.small{min-height:68px}.size-card img{object-fit:contain;display:block;flex:none}.size-label{font-size:9px;letter-spacing:.06em;color:#7c8597;margin-top:1px}.light .size-label{color:#707b8c}.silhouette .size-card{min-height:160px;background:#fff}.silhouette .size-card img{width:140px;height:140px;filter:brightness(0)}.silhouette .pose{background:#e4e8ee}.silhouette .name{color:#343b48}
</style></head><body><header class="intro"><div><div class="eyebrow">Tanong402 · Midnight Silver</div><h1>Kuwago, eight distinct gestures</h1></div><p>Pearl silver · icy moonlight · transparent SVG · 512 × 512</p></header><div id="boards"></div>
<script>
const poses=['wave','invite','thinking','reading','celebrate','sleepy','peek','point'];const sizes=[['64px',64,'small'],['128px',128,'medium'],['320px',230,'large']];const data=[['Midnight','#07090F','dark'],['Silver','#F4F5F7','light']];
for(const [label,color,cls] of data){const section=document.createElement('section');section.className='theme '+cls;section.innerHTML=`<h2>${label}<span>${color}</span></h2><div class="columns"></div>`;const cols=section.querySelector('.columns');for(const pose of poses){const col=document.createElement('article');col.className='pose';col.innerHTML=`<div class="name">${pose}</div><div class="sizes"></div>`;for(const [caption,n,sizeClass] of sizes){const card=document.createElement('div');card.className='size-card '+sizeClass;card.innerHTML=`<img width="${n}" height="${n}" src="../../apps/web/public/mascot/${pose}.svg" alt=""><span class="size-label">${caption}</span>`;col.querySelector('.sizes').append(card)}cols.append(col)}document.querySelector('#boards').append(section)}
const section=document.createElement('section');section.className='theme silhouette';section.innerHTML='<h2>Silhouette check<span>all fills reduced to black · shape only</span></h2><div class="columns"></div>';for(const pose of poses){const col=document.createElement('article');col.className='pose';col.innerHTML=`<div class="name">${pose}</div><div class="size-card"><img src="../../apps/web/public/mascot/${pose}.svg" alt=""></div>`;section.querySelector('.columns').append(col)}document.querySelector('#boards').append(section);
</script></body></html>
